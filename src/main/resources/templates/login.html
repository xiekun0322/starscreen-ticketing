<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 星幕影票</title>
    <link rel="stylesheet" href="/css/login-modal.css"> 
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #fff; color: #333; font-size: 14px; }
    a { text-decoration: none; color: inherit; }
    ul, li { list-style: none; }

    /* ===== 顶部导航 ===== */
    .top-nav { height: 80px; border-bottom: 1px solid #e5e5e5; display: flex;
               align-items: center; padding: 0 15%; position: sticky; top: 0;
               background: #fff; z-index: 100; }
    .logo { display: flex; align-items: center; margin-right: 40px; }
    .logo-icon { width: 40px; height: 40px; background: #1e3a8a; border-radius: 50%;
                 color: #fff; display: flex; justify-content: center; align-items: center;
                 font-weight: bold; font-size: 18px; margin-right: 10px; }
    .logo-text { font-size: 20px; font-weight: bold; }
    .main-menu { display: flex; height: 100%; }
    .main-menu li a { display: flex; align-items: center; height: 80px;
                      padding: 0 20px; font-size: 16px; color: #333; }
    .main-menu li a:hover { color: #1e3a8a; }

    /* ===== 主区域 ===== */
    .login-main { display: flex; min-height: calc(100vh - 80px); }

    /* ===== 左侧星空 ===== */
    .login-left {
        flex: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(ellipse at 50% 45%, #1e3a8a 0%, #0f172a 75%);
        overflow: hidden;
        color: #fff;
    }
    .login-left::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            radial-gradient(2px 2px at 20px 30px, #fff, transparent),
            radial-gradient(2px 2px at 120px 180px, #fff, transparent),
            radial-gradient(1px 1px at 220px 80px, #fff, transparent),
            radial-gradient(2px 2px at 320px 240px, #fff, transparent),
            radial-gradient(1px 1px at 420px 120px, #fff, transparent),
            radial-gradient(2px 2px at 80px 320px, #fff, transparent),
            radial-gradient(1px 1px at 380px 360px, #fff, transparent),
            radial-gradient(2px 2px at 520px 200px, #fff, transparent),
            radial-gradient(1px 1px at 620px 400px, #fff, transparent),
            radial-gradient(2px 2px at 280px 480px, #fff, transparent);
        opacity: 0.7;
        animation: driftStars 25s linear infinite;
    }
    @keyframes driftStars {
        from { transform: translateY(0); }
        to   { transform: translateY(-40px); }
    }
    .star-shape {
        width: 300px;
        height: 300px;
        background: linear-gradient(135deg, #93c5fd 0%, #3b82f6 50%, #1e3a8a 100%);
        clip-path: polygon(
            50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%,
            50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
        );
        filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.7));
        animation: starPulse 4s ease-in-out infinite;
        position: relative;
        z-index: 2;
    }
    @keyframes starPulse {
        0%, 100% { transform: scale(1) rotate(0deg); }
        50%      { transform: scale(1.04) rotate(3deg); }
    }
    .login-left-title {
        margin-top: 60px;
        font-size: 34px;
        font-weight: bold;
        letter-spacing: 6px;
        position: relative;
        z-index: 2;
        text-shadow: 0 0 20px rgba(147, 197, 253, 0.5);
    }
    .login-left-sub {
        margin-top: 18px;
        font-size: 15px;
        color: #93c5fd;
        letter-spacing: 3px;
        position: relative;
        z-index: 2;
    }

    /* ===== 右侧表单 ===== */
    .login-right {
        width: 540px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px 70px;
        background: #fff;
    }
    .login-title { font-size: 26px; font-weight: bold; color: #1e3a8a; margin-bottom: 30px; }

    .login-tabs { display: flex; border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
    .login-tab {
        flex: 1; padding: 14px 0; text-align: center; font-size: 15px;
        color: #999; cursor: pointer; border-bottom: 2px solid transparent;
        transition: all 0.2s;
    }
    .login-tab:hover  { color: #1e3a8a; }
    .login-tab.active { color: #1e3a8a; font-weight: bold; border-bottom-color: #1e3a8a; }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-row { margin-bottom: 20px; }
    .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 8px; }
    .form-row input {
        width: 100%; height: 48px; border: 1px solid #e5e5e5;
        border-radius: 6px; padding: 0 15px; font-size: 14px;
        outline: none; transition: border-color 0.2s;
    }
    .form-row input:focus { border-color: #1e3a8a; }

    .input-with-prefix {
        display: flex; align-items: center;
        border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden;
        transition: border-color 0.2s;
    }
    .input-with-prefix:focus-within { border-color: #1e3a8a; }
    .input-with-prefix .prefix {
        padding: 0 15px; height: 48px; display: flex; align-items: center;
        background: #fafafa; color: #666; border-right: 1px solid #e5e5e5; font-size: 14px;
    }
    .input-with-prefix input { flex: 1; border: none; border-radius: 0; height: 48px; }
    .input-with-prefix input:focus { border: none; }
    .input-with-prefix button {
        height: 48px; padding: 0 20px; border: none;
        background: #fff; color: #1e3a8a; font-size: 14px;
        cursor: pointer; border-left: 1px solid #e5e5e5; white-space: nowrap;
        transition: all 0.2s;
    }
    .input-with-prefix button:disabled { color: #ccc; cursor: not-allowed; }
    .input-with-prefix button:not(:disabled):hover { background: #f8f9ff; }

    .btn-login {
        width: 100%; height: 48px;
        background: #1e3a8a; color: #fff; border: none; border-radius: 6px;
        font-size: 16px; font-weight: bold; cursor: pointer;
        margin-top: 10px; transition: background 0.2s;
    }
    .btn-login:hover:not(:disabled) { background: #152c6b; }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; }

    .tips-box {
        margin-top: 20px; padding: 12px 15px;
        background: #eef2ff; border-radius: 6px;
        font-size: 13px; color: #1e3a8a; line-height: 1.7;
    }
    .tips-box strong { display: block; margin-bottom: 4px; }

    .msg {
        display: none; padding: 10px 15px; border-radius: 6px;
        font-size: 13px; margin-bottom: 18px;
    }
    .msg.error   { background: #fef0f0; color: #e74c3c; display: block; }
    .msg.success { background: #f0fff4; color: #43a047; display: block; }

    /* 密码强度提示 */
    .pwd-hint { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.8; }
    .pwd-hint .req { display: inline-block; margin-right: 10px; }
    .pwd-hint .ok { color: #43a047; }
    .pwd-hint .no { color: #999; }

    /* ===== 模态框 ===== */
    .modal-mask {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.5); z-index: 2000;
        justify-content: center; align-items: center;
    }
    .modal-mask.show { display: flex; }
    .modal {
        background: #fff; border-radius: 8px; padding: 30px;
        width: 420px; animation: popIn 0.2s ease-out;
        max-height: 90vh; overflow-y: auto;
    }
    @keyframes popIn {
        from { transform: scale(0.92); opacity: 0; }
        to   { transform: scale(1);    opacity: 1; }
    }
    .modal-title { font-size: 20px; font-weight: bold; color: #1e3a8a; margin-bottom: 12px; }
    .modal-sub { font-size: 13px; color: #999; margin-bottom: 20px; }
    .modal-sub .hl { color: #1e3a8a; font-weight: bold; }
    .modal input {
        width: 100%; height: 48px; border: 1px solid #e5e5e5;
        border-radius: 6px; padding: 0 15px; font-size: 14px; outline: none;
        transition: border-color 0.2s;
    }
    .modal input:focus { border-color: #1e3a8a; }
    .modal-btns { display: flex; gap: 10px; margin-top: 24px; }
    .modal-btns button {
        flex: 1; height: 44px; border-radius: 6px;
        font-size: 15px; cursor: pointer; border: none;
    }
    .btn-cancel  { background: #f5f5f5; color: #666; }
    .btn-cancel:hover { background: #ebebeb; }
    .btn-confirm { background: #1e3a8a; color: #fff; font-weight: bold; }
    .btn-confirm:hover:not(:disabled) { background: #152c6b; }
    .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }

    /* 密码提示（忘记密码弹窗内用） */
    .modal .form-row { margin-bottom: 16px; }
    .modal .form-row label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
    .modal .input-with-prefix {
        border: 1px solid #e5e5e5; border-radius: 6px;
    }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="top-nav">
    <a th:href="@{/}" class="logo">
        <div class="logo-icon">星</div>
        <div class="logo-text">星幕影票</div>
    </a>
    <ul class="main-menu">
        <li><a th:href="@{/}">首页</a></li>
        <li><a th:href="@{/}">电影</a></li>
        <li><a th:href="@{/}">影院</a></li>
        <li><a href="#">演出</a></li>
    </ul>
</header>

<div class="login-main">

    <!-- 左侧：星空 + 星形 -->
    <div class="login-left">
        <div class="star-shape"></div>
        <div class="login-left-title">星幕影票</div>
        <div class="login-left-sub">让每一次观影都值得</div>
    </div>

    <!-- 右侧：登录/注册表单 -->
    <div class="login-right">
        <div class="login-title">登录星幕</div>

        <!-- Tab -->
        <div class="login-tabs">
            <div class="login-tab active" id="tabSms">手机号验证码</div>
            <div class="login-tab" id="tabPwd">账号密码</div>
        </div>

        <div id="msgBox" class="msg"></div>

        <!-- ============ 手机验证码 ============ -->
        <div class="form-panel active" id="panelSms">
            <div class="form-row">
                <label>手机号</label>
                <div class="input-with-prefix">
                    <div class="prefix">+86</div>
                    <input type="tel" id="smsPhone" placeholder="请输入手机号" maxlength="11">
                </div>
            </div>

            <div class="form-row">
                <label>短信验证码</label>
                <div class="input-with-prefix">
                    <input type="text" id="smsCode" placeholder="请输入 6 位验证码" maxlength="6">
                    <button type="button" id="sendCodeBtn" disabled>发送验证码</button>
                </div>
            </div>

            <button class="btn-login" id="smsLoginBtn" disabled>登录 / 注册</button>

            <div class="tips-box">
                <strong>温馨提示</strong>
                未注册的手机号将自动创建新账号。<br>
                首次注册只支持手机号验证码。
            </div>
        </div>

        <!-- ============ 账号密码 ============ -->
        <div class="form-panel" id="panelPwd">
            <div class="form-row">
                <label>用户名</label>
                <input type="text" id="pwdUsername" placeholder="请输入用户名" autocomplete="username">
            </div>

            <div class="form-row">
                <label>密码</label>
                <input type="password" id="pwdPassword" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn-login" id="pwdLoginBtn" disabled>登录</button>

            <!-- 忘记密码入口 -->
            <div style="text-align:right;margin-top:12px;">
                <a href="javascript:void(0)" id="forgotPwdLink"
                   style="color:#1e3a8a;font-size:13px;">忘记密码？</a>
            </div>

            <div class="tips-box">
                <strong>账号密码登录说明</strong>
                只有已在手机验证码登录后绑定过账号密码的用户才能使用。<br>
                未绑定？请先用手机号验证码登录，再去「个人中心 → 绑定账号」。
            </div>
        </div>
    </div>
</div>

<!-- ============ 验证码弹窗 ============ -->
<div class="modal-mask" id="smsModal">
    <div class="modal">
        <div class="modal-title">请输入验证码</div>
        <div class="modal-sub">
            验证码已发送至 <span class="hl" id="modalPhone">138****0000</span>
        </div>
        <input type="text" id="modalCodeInput" placeholder="请输入验证码" maxlength="6" autocomplete="one-time-code"
               style="text-align:center;font-size:20px;letter-spacing:8px;">
        <div class="modal-btns">
            <button class="btn-cancel" id="modalCancelBtn">取消</button>
            <button class="btn-confirm" id="modalConfirmBtn">确认登录</button>
        </div>
    </div>
</div>

<!-- ============ 忘记密码弹窗 ============ -->
<div class="modal-mask" id="forgotModal">
    <div class="modal" style="width:440px;">
        <div class="modal-title">重置密码</div>
        <div class="modal-sub">请使用注册手机号重置密码</div>

        <!-- 步骤指示 -->
        <div style="display:flex;justify-content:space-between;margin-bottom:24px;
                    font-size:12px;color:#999;">
            <span id="fpStep1" style="color:#1e3a8a;font-weight:bold;">① 验证手机</span>
            <span id="fpStep2">② 设置新密码</span>
        </div>

        <!-- 第一步：手机号 + 验证码 -->
        <div id="fpPanel1">
            <div class="form-row">
                <label>手机号</label>
                <div class="input-with-prefix">
                    <div class="prefix">+86</div>
                    <input type="tel" id="fpPhone" placeholder="请输入注册手机号" maxlength="11">
                </div>
            </div>

            <div class="form-row">
                <label>短信验证码</label>
                <div class="input-with-prefix">
                    <input type="text" id="fpCode" placeholder="请输入 6 位验证码" maxlength="6">
                    <button type="button" id="fpSendBtn" disabled>发送验证码</button>
                </div>
            </div>
        </div>

        <!-- 第二步：新密码 -->
        <div id="fpPanel2" style="display:none;">
            <div class="form-row">
                <label>新密码</label>
                <input type="password" id="fpNewPwd" placeholder="8~20 位强密码">
                <div class="pwd-hint" id="fpPwdHint">
                    <span class="req no" data-rule="len">8~20 位</span>
                    <span class="req no" data-rule="upper">大写字母</span>
                    <span class="req no" data-rule="lower">小写字母</span>
                    <span class="req no" data-rule="digit">数字</span>
                    <span class="req no" data-rule="special">特殊字符</span>
                </div>
            </div>
            <div class="form-row">
                <label>确认新密码</label>
                <input type="password" id="fpConfirmPwd" placeholder="请再次输入新密码">
            </div>
        </div>

        <div id="fpMsg" class="msg"></div>

        <div class="modal-btns">
            <button class="btn-cancel" id="fpCancelBtn">取消</button>
            <button class="btn-confirm" id="fpNextBtn">下一步</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

    // ========== 元素 ==========
    const tabSms = document.getElementById('tabSms');
    const tabPwd = document.getElementById('tabPwd');
    const panelSms = document.getElementById('panelSms');
    const panelPwd = document.getElementById('panelPwd');
    const msgBox = document.getElementById('msgBox');

    const smsPhone = document.getElementById('smsPhone');
    const smsCode = document.getElementById('smsCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const smsLoginBtn = document.getElementById('smsLoginBtn');

    const pwdUsername = document.getElementById('pwdUsername');
    const pwdPassword = document.getElementById('pwdPassword');
    const pwdLoginBtn = document.getElementById('pwdLoginBtn');

    const smsModal = document.getElementById('smsModal');
    const modalPhone = document.getElementById('modalPhone');
    const modalCodeInput = document.getElementById('modalCodeInput');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');

    let countdown = 0;
    let timer = null;

    // ========== 工具 ==========
    function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = 'msg ' + type;
    }
    function hideMsg() { msgBox.className = 'msg'; }

    // ========== Tab 切换 ==========
    tabSms.addEventListener('click', function () {
        tabSms.classList.add('active');
        tabPwd.classList.remove('active');
        panelSms.classList.add('active');
        panelPwd.classList.remove('active');
        hideMsg();
    });
    tabPwd.addEventListener('click', function () {
        tabPwd.classList.add('active');
        tabSms.classList.remove('active');
        panelPwd.classList.add('active');
        panelSms.classList.remove('active');
        hideMsg();
    });

    // ============================================================
    //  手机验证码面板
    // ============================================================
    function checkSendBtn() {
        const phone = smsPhone.value.trim();
        const valid = /^1[3-9]\d{9}$/.test(phone);
        sendCodeBtn.disabled = !(valid && countdown === 0);
        sendCodeBtn.textContent = countdown > 0 ? (countdown + ' 秒后重发') : '发送验证码';
    }
    function checkSmsLoginBtn() {
        const vp = /^1[3-9]\d{9}$/.test(smsPhone.value.trim());
        const vc = /^\d{6}$/.test(smsCode.value.trim());
        smsLoginBtn.disabled = !(vp && vc);
    }
    smsPhone.addEventListener('input', function () { checkSendBtn(); checkSmsLoginBtn(); });
    smsCode.addEventListener('input', checkSmsLoginBtn);
    checkSendBtn();
    checkSmsLoginBtn();

    sendCodeBtn.addEventListener('click', function () {
        const phone = smsPhone.value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的手机号', 'error'); return; }
        sendCodeBtn.disabled = true;

        fetch('/api/user/send-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            modalPhone.textContent = phone.substring(0, 3) + '****' + phone.substring(7);
            modalCodeInput.value = '';
            smsModal.classList.add('show');
            setTimeout(() => modalCodeInput.focus(), 100);
            countdown = 60;
            checkSendBtn();
            timer = setInterval(function () {
                countdown--;
                checkSendBtn();
                if (countdown <= 0) { clearInterval(timer); checkSendBtn(); }
            }, 1000);
        })
        .catch(err => {
            showMsg(err.message || '发送失败', 'error');
            sendCodeBtn.disabled = false;
            checkSendBtn();
        });
    });

    modalCancelBtn.addEventListener('click', function () {
        smsModal.classList.remove('show');
    });
    modalConfirmBtn.addEventListener('click', function () {
        const code = modalCodeInput.value.trim();
        if (!/^\d{6}$/.test(code)) { alert('请输入 6 位验证码'); return; }
        smsCode.value = code;
        checkSmsLoginBtn();
        smsModal.classList.remove('show');
        doSmsLogin();
    });
    modalCodeInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); modalConfirmBtn.click(); }
    });

    smsLoginBtn.addEventListener('click', doSmsLogin);

    function doSmsLogin() {
        const phone = smsPhone.value.trim();
        const code = smsCode.value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的手机号', 'error'); return; }
        if (!/^\d{6}$/.test(code)) { showMsg('请输入 6 位验证码', 'error'); return; }

        smsLoginBtn.disabled = true;
        smsLoginBtn.textContent = '登录中...';

        fetch('/api/user/login-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone, code: code })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            showMsg('登录成功，跳转中...', 'success');
            setTimeout(() => {
                const back = sessionStorage.getItem('loginBack') || '/';
                sessionStorage.removeItem('loginBack');
                window.location.href = back;
            }, 700);
        })
        .catch(err => {
            showMsg(err.message || '登录失败', 'error');
            smsLoginBtn.disabled = false;
            smsLoginBtn.textContent = '登录 / 注册';
            checkSmsLoginBtn();
        });
    }

    // ============================================================
    //  账号密码面板
    // ============================================================
    function checkPwdLoginBtn() {
        const u = pwdUsername.value.trim();
        const p = pwdPassword.value.trim();
        pwdLoginBtn.disabled = !(u && p);
    }
    pwdUsername.addEventListener('input', checkPwdLoginBtn);
    pwdPassword.addEventListener('input', checkPwdLoginBtn);
    checkPwdLoginBtn();

    pwdLoginBtn.addEventListener('click', function () {
        const username = pwdUsername.value.trim();
        const password = pwdPassword.value.trim();
        if (!username || !password) { showMsg('请填写用户名和密码', 'error'); return; }

        pwdLoginBtn.disabled = true;
        pwdLoginBtn.textContent = '登录中...';

        fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            showMsg('登录成功，跳转中...', 'success');
            setTimeout(() => {
                const back = sessionStorage.getItem('loginBack') || '/';
                sessionStorage.removeItem('loginBack');
                window.location.href = back;
            }, 700);
        })
        .catch(err => {
            showMsg(err.message || '登录失败', 'error');
            pwdLoginBtn.disabled = false;
            pwdLoginBtn.textContent = '登录';
            checkPwdLoginBtn();
        });
    });

    // ============================================================
    //  忘记密码
    // ============================================================
    const forgotModal = document.getElementById('forgotModal');
    const forgotPwdLink = document.getElementById('forgotPwdLink');
    const fpPhone = document.getElementById('fpPhone');
    const fpCode = document.getElementById('fpCode');
    const fpSendBtn = document.getElementById('fpSendBtn');
    const fpNewPwd = document.getElementById('fpNewPwd');
    const fpConfirmPwd = document.getElementById('fpConfirmPwd');
    const fpPwdHint = document.getElementById('fpPwdHint');
    const fpMsg = document.getElementById('fpMsg');
    const fpStep1 = document.getElementById('fpStep1');
    const fpStep2 = document.getElementById('fpStep2');
    const fpPanel1 = document.getElementById('fpPanel1');
    const fpPanel2 = document.getElementById('fpPanel2');
    const fpNextBtn = document.getElementById('fpNextBtn');
    const fpCancelBtn = document.getElementById('fpCancelBtn');

    let fpCurrentStep = 1;
    let fpCountdown = 0;
    let fpTimer = null;

    const FP_PWD_RULES = {
        len:     { regex: /^.{8,20}$/,     label: '8~20 位' },
        upper:   { regex: /[A-Z]/,         label: '大写字母' },
        lower:   { regex: /[a-z]/,         label: '小写字母' },
        digit:   { regex: /\d/,            label: '数字' },
        special: { regex: /[!@#$%^&*._-]/, label: '特殊字符' }
    };
    const FP_PWD_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*._-])[A-Za-z\d!@#$%^&*._-]{8,20}$/;

    function fpShowMsg(text, type) {
        fpMsg.textContent = text;
        fpMsg.className = 'msg ' + type;
    }
    function fpHideMsg() { fpMsg.className = 'msg'; }

    function fpUpdatePwdHint(pwd) {
        Object.keys(FP_PWD_RULES).forEach(k => {
            const el = fpPwdHint.querySelector('[data-rule="' + k + '"]');
            if (FP_PWD_RULES[k].regex.test(pwd)) {
                el.classList.remove('no'); el.classList.add('ok');
            } else {
                el.classList.remove('ok'); el.classList.add('no');
            }
        });
    }

    function fpCheckSendBtn() {
        const valid = /^1[3-9]\d{9}$/.test(fpPhone.value.trim());
        fpSendBtn.disabled = !(valid && fpCountdown === 0);
        fpSendBtn.textContent = fpCountdown > 0 ? (fpCountdown + ' 秒后重发') : '发送验证码';
    }
    function fpCheckStep1Next() {
        const vp = /^1[3-9]\d{9}$/.test(fpPhone.value.trim());
        const vc = /^\d{6}$/.test(fpCode.value.trim());
        fpNextBtn.disabled = !(vp && vc);
    }
    function fpCheckStep2Next() {
        const p1 = fpNewPwd.value.trim();
        const p2 = fpConfirmPwd.value.trim();
        fpNextBtn.disabled = !(FP_PWD_REGEX.test(p1) && p1 === p2);
    }

    forgotPwdLink.addEventListener('click', function () {
        fpCurrentStep = 1;
        fpPhone.value = '';
        fpCode.value = '';
        fpNewPwd.value = '';
        fpConfirmPwd.value = '';
        fpUpdatePwdHint('');
        fpHideMsg();
        switchFpStep(1);
        forgotModal.classList.add('show');
    });

    fpCancelBtn.addEventListener('click', function () {
        forgotModal.classList.remove('show');
        if (fpTimer) { clearInterval(fpTimer); fpTimer = null; }
    });

    function switchFpStep(step) {
        fpCurrentStep = step;
        if (step === 1) {
            fpPanel1.style.display = 'block';
            fpPanel2.style.display = 'none';
            fpStep1.style.color = '#1e3a8a'; fpStep1.style.fontWeight = 'bold';
            fpStep2.style.color = '#999'; fpStep2.style.fontWeight = 'normal';
            fpNextBtn.textContent = '下一步';
            fpCheckStep1Next();
        } else {
            fpPanel1.style.display = 'none';
            fpPanel2.style.display = 'block';
            fpStep1.style.color = '#999'; fpStep1.style.fontWeight = 'normal';
            fpStep2.style.color = '#1e3a8a'; fpStep2.style.fontWeight = 'bold';
            fpNextBtn.textContent = '确认重置';
            fpCheckStep2Next();
        }
    }

    fpPhone.addEventListener('input', function () {
        fpCheckSendBtn();
        if (fpCurrentStep === 1) fpCheckStep1Next();
    });
    fpCode.addEventListener('input', function () {
        if (fpCurrentStep === 1) fpCheckStep1Next();
    });
    fpNewPwd.addEventListener('input', function () {
        fpUpdatePwdHint(this.value);
        if (fpCurrentStep === 2) fpCheckStep2Next();
    });
    fpConfirmPwd.addEventListener('input', function () {
        if (fpCurrentStep === 2) fpCheckStep2Next();
    });

    fpCheckSendBtn();
    fpCheckStep1Next();

    fpSendBtn.addEventListener('click', function () {
        const phone = fpPhone.value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { fpShowMsg('请输入正确的手机号', 'error'); return; }
        fpSendBtn.disabled = true;

        fetch('/api/user/send-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            fpShowMsg('验证码已发送（演示环境请看控制台）', 'success');
            fpCountdown = 60;
            fpCheckSendBtn();
            fpTimer = setInterval(function () {
                fpCountdown--;
                fpCheckSendBtn();
                if (fpCountdown <= 0) { clearInterval(fpTimer); fpTimer = null; fpCheckSendBtn(); }
            }, 1000);
        })
        .catch(err => {
            fpShowMsg(err.message || '发送失败', 'error');
            fpSendBtn.disabled = false;
            fpCheckSendBtn();
        });
    });

    fpNextBtn.addEventListener('click', function () {
        if (fpCurrentStep === 1) {
            const phone = fpPhone.value.trim();
            const code = fpCode.value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) { fpShowMsg('请输入正确的手机号', 'error'); return; }
            if (!/^\d{6}$/.test(code)) { fpShowMsg('请输入 6 位验证码', 'error'); return; }
            fpHideMsg();
            switchFpStep(2);
        } else {
            const phone = fpPhone.value.trim();
            const code = fpCode.value.trim();
            const newPwd = fpNewPwd.value.trim();
            const confirmPwd = fpConfirmPwd.value.trim();

            if (!FP_PWD_REGEX.test(newPwd)) {
                fpShowMsg('密码必须包含大小写字母、数字、特殊字符，长度 8~20 位', 'error');
                return;
            }
            if (newPwd !== confirmPwd) {
                fpShowMsg('两次输入的密码不一致', 'error');
                return;
            }

            fpNextBtn.disabled = true;
            fpNextBtn.textContent = '提交中...';

            fetch('/api/user/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, code: code, newPassword: newPwd })
            })
            .then(r => r.json())
            .then(result => {
                if (result.code !== 200) throw new Error(result.message);
                fpShowMsg('密码重置成功，请使用新密码登录', 'success');
                setTimeout(function () {
                    forgotModal.classList.remove('show');
                    if (fpTimer) { clearInterval(fpTimer); fpTimer = null; }
                    pwdPassword.value = '';
                    checkPwdLoginBtn();
                }, 1200);
            })
            .catch(err => {
                fpShowMsg(err.message || '重置失败', 'error');
                fpNextBtn.disabled = false;
                fpNextBtn.textContent = '确认重置';
                fpCheckStep2Next();
            });
        }
    });

});
</script>

</body>
</html>
